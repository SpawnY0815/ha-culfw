set_holiday:
  target:
    entity:
      integration: culfw
      domain: climate
  fields:
    until:
      required: true
      example: "2026-12-27 00:00:00"
      selector:
        datetime:
    temperature:
      required: true
      example: 16
      selector:
        number:
          min: 6
          max: 30
          step: 0.5
          unit_of_measurement: "°C"

